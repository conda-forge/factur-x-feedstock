schema_version: 1

context:
  name: factur-x
  version: "7.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c7efa5e559612a790faf97904aa5bc64300d11f7c35c9ba52467b0c5fb6d4c53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - hatchling
    - hatch-requirements-txt
  run:
    - python >=${{ python_min }}
    - pypdf >=5.3.0
    - lxml
    - python-stdnum
    - requests
    - iso4217
tests:
  - python:
      imports:
        - facturx
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: 'Factur-X and Order-X: electronic invoicing and ordering standards'
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/akretion/factur-x

extra:
  recipe-maintainers:
    - jan-janssen
